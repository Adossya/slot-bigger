<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Bigger Bass Splash Slot</title>
    <link rel="icon" type="image/x-icon" sizes="16x16" href="./favicon-16x16.ico" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="./favicon-32x32.ico" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="./favicon-48x48.ico" />
    <link rel="stylesheet" href="css/style.min.css">

</head>
<body class="body active">


    
    <!--Loader-->
    <div class="loader">
  <div class="loader__bg">
    <img src="./img/loader_bg.png" loading="eager" alt="sea_bg" class="loader__bg">
  </div>
  <div class="loader__title">
    <img src="./img/game_title.png" alt="title_name" class="loader__title">
  </div>
  <img src="./img/loader_fisher.png" loading="eager" alt="loader_fisher" class="loader__fisher">
  <div class="loader__loading">
    <div class="loader__loading-wrapper">
        <img src="./img/loading.png"  loading="eager" alt="loading" class="loader__loading--bg">
        <div class="loader__loading--shadow"></div>
    </div>

    <img src="./img/loader_cocos.png" loading="eager" alt="cocos" class="loader__loading--cocos">
  </div>
</div>


    <!--Promo-->
    <section class="promo">
 
    <div class="promo__slot">
        <div class="promo__slot-bg">
            <img src="./img/slot-grid.png" alt="grid">
        </div>
        <div class="promo__cells" id="slot-grid">

        </div>
        <div class="promo__result">
            <div class="promo__result-bg"></div>
            <div class="promo__result-count">FREE SPINS: <span>3</span></div>
        </div>
        <button id="spin" class="promo__btn">SPIN</button>
    </div>



    <!--Pop-start-->
    <div id="start" class="pop">
    <div class="pop__overlay"></div>
    <div class="pop__wrapper">
         <h2 class="pop__title">WOW! <br>   <span>YOU RECEIVED:</span></h2>
        <div class="pop__subtitle">3 free spins</div>
        <div class="pop__notafication">
            <img src="./img/cansel.png" alt="cansel" class="pop__cansel">
            <div class="pop__descr">Without registration</div>
        </div>
        <div class="pop__btn">
            <div class="pop__btn-bg"></div> 
            <div class="pop__btn-text">ACTIVATE</div>
        </div>
    </div>
   
</div>

    <!--Pop-end-->
    <div id="end" class="pop pop-end">
    <div class="pop__overlay pop-end__overlay"></div>
    <div class="pop__wrapper pop-end__wrapper">
        <h2 class="pop__title pop-end__title">WELL<br>DONE! </h2>
        <div class="pop-end__winner">YOU WON:</div>
        <div class="pop__subtitle pop-end__subtitle">450 GPB</div>
        <div class="pop-end__free">+250 Free spins</div>
        <div class="pop__notafication pop-end__notafication">
            <img src="./img/approve.png" alt="apporve" class="pop__cansel pop-end__approve">
            <div class="pop__descr pop-end__descr">Turn on <br>notification <br> and receive <br>more special <br>bonuses!</div>
        </div>
        <div class="pop__btn pop-end__btn">
            <div class="pop__btn-bg pop-end__btn-bg"></div> 
            <a href="https://anton-lupalov.web.app/about" class="pop__btn-text pop-end__btn-text">INSTALL <br> THE APP</a>
        </div>
        <div class="pop-end__timer">
                <div class="pop-end__timer-bonus">Bonus will expire in :</div>
                <div class="pop-end__timer-time"><span id="minutes">15</span>: <span id="seconds">00</span> </div>
                <div class="pop-end__timer-names"><span>MINUTES</span> <span>SECONDS</span></div>
        </div>
    </div>
</div>

    
</section>



    <script src="js/script.min.js"></script>
</body>
</html>
